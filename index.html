<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 차 어디?</title>
<meta name="theme-color" content="#F4F5F7">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192-v2.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="내 차 어디">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F5F7; --card: #FFFFFF; --line: #DDE1E7; --ink: #161A22; --muted: #5D6573; --hint: #A3AAB6;
    --accent: #1F3D7A; --soft: #E6ECF7; --danger: #B3341F; --ok: #2F7A3B;
    --nav-h: 64px; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
  button, input { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .hide { display: none !important; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .mt { margin-top: 10px; }
  .mt2 { margin-top: 22px; }
  .empty { text-align: center; color: var(--muted); padding: 28px 16px; font-size: 14px; }

  #app { max-width: 560px; margin: 0 auto; padding: calc(12px + var(--safe-t)) 14px calc(var(--nav-h) + var(--safe-b) + 28px); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 6px 2px 14px; }
  .top h1 { font-size: 24px; margin: 0; font-weight: 700; }
  .dtop { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 2px 0 8px; }
  .dtop b { font-size: 17px; }
  .back { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; color: var(--accent); font-weight: 500; }
  .back svg.i { width: 18px; height: 18px; }
  .label { font-size: 13px; font-weight: 700; color: var(--muted); margin: 16px 2px 6px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 0 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); font-weight: 500; cursor: pointer; }
  .btn.sm { min-height: 40px; font-size: 14px; padding: 0 12px; border-radius: 10px; }
  .btn.big { min-height: 54px; font-size: 17px; font-weight: 700; }
  .btn.block { width: 100%; }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: var(--danger); }
  .btn svg.i { width: 18px; height: 18px; }
  .row-btns { display: flex; gap: 8px; }
  .row-btns > * { flex: 1; }
  .link { background: none; border: 0; color: var(--accent); font-weight: 500; padding: 6px 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .link.sm { font-size: 13px; }
  .link.danger { color: var(--danger); }
  .link:disabled { color: var(--hint); }
  .link svg.i { width: 16px; height: 16px; }
  .inp { width: 100%; min-height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 16px; }
  .inp:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips.mini { margin-top: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line);
    background: var(--card); font-weight: 500; cursor: pointer; font-size: 15px; }
  .chip.sm { min-height: 34px; font-size: 13px; padding: 0 12px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.add { color: var(--accent); border-style: dashed; }
  .chip.add svg.i { width: 16px; height: 16px; }
  .chips.floors { gap: 6px; }
  .chips.floors .chip { min-width: 48px; padding: 0 8px; justify-content: center; font-weight: 700; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .dot.big { width: 16px; height: 16px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .card.list { padding: 0 14px; }
  .sec { display: flex; align-items: center; justify-content: space-between; margin: 20px 2px 10px; }
  .sec h2 { font-size: 17px; margin: 0; }
  .sec h2 small { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); min-height: 56px; }
  .li:last-child { border-bottom: 0; }
  .li-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .li-main b { font-weight: 500; }
  .chev { color: var(--hint); font-size: 22px; }

  .hero { text-align: center; padding: 26px 18px 18px; }
  .hero .w-car { justify-content: center; }
  .hero-ic { width: 64px; height: 64px; margin: 14px auto 10px; border-radius: 50%; background: var(--soft); color: var(--accent); display: grid; place-items: center; }
  .hero-ic svg.i { width: 32px; height: 32px; }
  .hero b { font-size: 17px; display: block; }
  .hero p { margin: 4px 0 16px; }

  .where .w-car, .hero .w-car { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .w-title { font-size: 22px; font-weight: 700; margin-top: 4px; line-height: 1.3; }
  .w-title .floor { display: inline-block; background: var(--accent); color: #fff; border-radius: 8px; padding: 0 10px; margin-left: 4px; font-size: 22px; }
  .w-spot { font-size: 17px; font-weight: 500; margin-top: 6px; }
  .w-time { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .map-wrap { margin-bottom: 4px; }
  .mapbox { position: relative; height: 46vh; min-height: 280px; border-radius: 16px; border: 1px solid var(--line); background: #E9ECF1; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  .mapbox.tall { height: 52vh; }
  .map-inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .map-inner img { display: block; width: 100%; height: 100%; pointer-events: none; -webkit-user-drag: none; }
  .pin { position: absolute; transform-origin: 50% 100%; pointer-events: none; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
  .pin svg { display: block; }
  .pin .pin-ev, .pin.ev .pin-dot { display: none; }
  .pin.ev .pin-ev { display: inline; }
  .map-zoom { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .map-zoom button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.94); font-size: 20px; line-height: 1; cursor: pointer; }
  .map-note { font-size: 12px; color: var(--muted); margin: 6px 4px 0; }
  .map-note.warn { color: #7A4B00; background: #FFF6E5; border: 1px solid #F0D49B; border-radius: 10px; padding: 8px 10px; font-size: 13px; }
  .picked { font-size: 13px; color: var(--muted); margin: 6px 4px 0; }
  .picked.ok { color: var(--ok); font-weight: 700; }

  .photo-btn { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 10px; padding: 8px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); cursor: pointer; text-align: left; }
  .photo-btn img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; background: #E9ECF1; }
  .draft-photo { display: block; width: 100%; max-height: 220px; object-fit: cover; border-radius: 12px; margin-top: 8px; }
  .viewer { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.92); display: grid; place-items: center; padding: 16px; }
  .viewer img { max-width: 100%; max-height: 100%; border-radius: 8px; }

  .floor-card { padding: 12px; }
  .fc-head { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .fc-head .inp { flex: 1; min-height: 40px; font-weight: 700; }
  .fc-map { display: block; width: 100%; max-height: 220px; object-fit: contain; background: #E9ECF1; border-radius: 10px; margin-bottom: 10px; cursor: zoom-in; }
  .fc-empty { font-size: 13px; color: var(--muted); background: #F0F2F5; border-radius: 10px; padding: 18px; text-align: center; margin-bottom: 10px; }
  .ev-badge { display: inline-flex; align-items: center; gap: 2px; background: #FFF3BF; color: #8A5A00; border: 1px solid #F5D565; border-radius: 8px; padding: 0 8px; font-size: 15px; font-weight: 700; vertical-align: middle; margin-left: 4px; }
  .ev-badge.sm { font-size: 12px; padding: 0 6px; border-radius: 6px; margin: 0 4px 0 0; }
  .chip .bolt { color: #E8A400; font-size: 12px; margin-left: -2px; }
  .chip.on .bolt { color: #FFD43B; }
  .ev-toggle { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); cursor: pointer; text-align: left; margin-top: 16px; }
  .ev-toggle .ev-ic { width: 36px; height: 36px; border-radius: 50%; background: #F0F2F5; display: grid; place-items: center; font-size: 18px; flex: none; }
  .ev-toggle b { display: block; font-weight: 700; }
  .ev-toggle span { font-size: 12px; color: var(--muted); }
  .ev-toggle .sw { margin-left: auto; width: 48px; height: 28px; border-radius: 14px; background: #D5DAE2; position: relative; flex: none; transition: .15s; }
  .ev-toggle .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: .15s; }
  .ev-toggle.on { border-color: #F5D565; background: #FFFBEA; }
  .ev-toggle.on .ev-ic { background: #FFE066; }
  .ev-toggle.on .sw { background: #E8A400; }
  .ev-toggle.on .sw::after { left: 23px; }
  .fc-ev { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 0 0 10px; cursor: pointer; }
  .fc-ev input { width: 20px; height: 20px; accent-color: #E8A400; }
  .tints { display: flex; gap: 12px; }
  .tint { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
  .tint.on { box-shadow: 0 0 0 3px var(--ink); }

  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b);
    background: rgba(255,255,255,.96); border-top: 1px solid var(--line); display: flex; justify-content: center; }
  .nav a { flex: 1; max-width: 186px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--hint); font-weight: 500; }
  .nav a svg.i { width: 24px; height: 24px; }
  .nav a.on { color: var(--accent); }
  #toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + var(--safe-b) + 16px); transform: translate(-50%, 20px); opacity: 0; transition: .2s;
    background: #222831; color: #fff; padding: 10px 16px; border-radius: 22px; font-size: 14px; z-index: 60; pointer-events: none; white-space: nowrap; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<main id="app"></main>
<nav class="nav" id="nav"></nav>
<script type="module" src="js/app.js"></script>
</body>
</html>
